[package]
name = "chatmux"
version = "0.0.2"
description = "ChatMux desktop shell"
authors = ["ChatMux"]
license = "MIT"
repository = "https://github.com/binjie09/ChatMux"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
